<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Admin Control Panel - Realona</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .admin-container { max-width: 900px; margin: 20px auto; padding: 15px; }
        .admin-card { background: #161b22; border: 1px solid #30363d; border-radius: 12px; padding: 20px; margin-bottom: 20px; text-align: left; }
        .tab-buttons { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
        .tab-btn { background: #21262d; border: 1px solid #30363d; color: #8b949e; padding: 10px 16px; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .tab-btn.active { background: #1f6feb; color: #fff; border-color: #1f6feb; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-size: 13px; color: #8b949e; margin-bottom: 5px; }
        .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 10px; background: #0d1117; border: 1px solid #30363d; color: #c9d1d9; border-radius: 6px; box-sizing: border-box; }
        .btn-admin { background: #238636; color: #fff; border: none; padding: 8px 12px; border-radius: 6px; font-weight: bold; cursor: pointer; }
        .btn-danger { background: #da3633; color: #fff; border: none; padding: 8px 12px; border-radius: 6px; font-weight: bold; cursor: pointer; }
        .table-custom { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 13px; }
        .table-custom th, .table-custom td { border: 1px solid #30363d; padding: 10px; text-align: left; color: #c9d1d9; }
        .table-custom th { background: #0d1117; }
    </style>
</head>
<body>
    <nav>
        <a href="index.html">Home</a>
        <a href="sell.html">Sell</a>
        <a href="dashboard.html">Dashboard</a>
        <a href="wallet.html">Wallet</a>
        <a href="admin.html" style="color:#58a6ff;">Admin Panel</a>
    </nav>
    <div class="admin-container">
        <h2 style="color:#c9d1d9; margin-bottom:5px;">🛡️ Admin Control Center</h2>
        <p style="color:#8b949e; font-size:13px; margin-bottom:20px;">Manage deposits, trade disputes, and user wallet balances.</p>

        <div class="tab-buttons">
            <button class="tab-btn active" onclick="switchTab('deposits')">1. Pending Deposits</button>
            <button class="tab-btn" onclick="switchTab('wallet')">2. Manual Wallet Adjustment</button>
        </div>

        <!-- Pending Deposits Tab -->
        <div id="tabDeposits" class="admin-card">
            <h3 style="margin-top:0; color:#c9d1d9;">User Deposit Confirmation</h3>
            <p style="color:#8b949e; font-size:12px;">Confirm proof of payment to credit user wallet balances.</p>
            <table class="table-custom">
                <thead>
                    <tr>
                        <th>User Email</th>
                        <th>Amount</th>
                        <th>Status</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="depositsTableBody">
                    <tr>
                        <td colspan="4" style="text-align:center; color:#8b949e;">No pending deposits right now.</td>
                    </tr>
                </tbody>
            </table>
        </div>

        <!-- Manual Wallet Adjustments Tab -->
        <div id="tabWallet" class="admin-card" style="display:none;">
            <h3 style="margin-top:0; color:#c9d1d9;">Manual Wallet Adjustment</h3>
            <form onsubmit="submitWalletAdjustment(event)">
                <div class="form-group">
                    <label>User Email</label>
                    <input type="email" id="adjUserEmail" required placeholder="user@gmail.com">
                </div>
                <div class="form-group">
                    <label>Action</label>
                    <select id="adjType">
                        <option value="add">Add Balance (Credit)</option>
                        <option value="subtract">Subtract Balance (Debit)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Amount (₦)</label>
                    <input type="number" id="adjAmount" required placeholder="5000">
                </div>
                <button type="submit" class="btn-admin">Update Balance</button>
            </form>
        </div>
    </div>
    <script>
        let currentUser = JSON.parse(localStorage.getItem('realonaCurrentUser') || 'null');
        if (!currentUser || !currentUser.isAdmin) {
            alert('⛔ Access Denied: Administrator privileges required.');
            window.location.href = 'auth.html';
        }

        function switchTab(tab) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('tabDeposits').style.display = tab === 'deposits' ? 'block' : 'none';
            document.getElementById('tabWallet').style.display = tab === 'wallet' ? 'block' : 'none';
            event.target.classList.add('active');
        }

        function loadDeposits() {
            let deposits = JSON.parse(localStorage.getItem('realona_pending_deposits') || '[]');
            let tbody = document.getElementById('depositsTableBody');
            
            if (deposits.length === 0) {
                tbody.innerHTML = `<tr><td colspan="4" style="text-align:center; color:#8b949e;">No pending deposits.</td></tr>`;
                return;
            }

            tbody.innerHTML = deposits.map((dep, idx) => `
                <tr>
                    <td>${dep.email}</td>
                    <td style="color:#3fb950; font-weight:bold;">₦${parseFloat(dep.amount).toLocaleString()}</td>
                    <td style="color:#e3b341;">${dep.status || 'Pending'}</td>
                    <td>
                        <button onclick="approveDeposit(${idx})" class="btn-admin">Approve & Credit</button>
                    </td>
                </tr>
            `).join('');
        }

        function approveDeposit(idx) {
            let deposits = JSON.parse(localStorage.getItem('realona_pending_deposits') || '[]');
            let item = deposits[idx];

            let currentBal = parseFloat(localStorage.getItem('realona_wallet_' + item.email) || '0');
            let newBal = currentBal + parseFloat(item.amount);
            
            localStorage.setItem('realona_wallet_' + item.email, newBal);
            
            deposits.splice(idx, 1);
            localStorage.setItem('realona_pending_deposits', JSON.stringify(deposits));

            alert(`✅ Approved! Credited ₦${item.amount} to ${item.email}. New balance: ₦${newBal.toLocaleString()}`);
            loadDeposits();
        }

        function submitWalletAdjustment(e) {
            e.preventDefault();
            let email = document.getElementById('adjUserEmail').value.trim();
            let type = document.getElementById('adjType').value;
            let amount = parseFloat(document.getElementById('adjAmount').value);

            let currentBal = parseFloat(localStorage.getItem('realona_wallet_' + email) || '0');
            let newBal = type === 'add' ? currentBal + amount : Math.max(0, currentBal - amount);

            localStorage.setItem('realona_wallet_' + email, newBal);
            alert(`✅ Wallet updated for ${email}! New balance: ₦${newBal.toLocaleString()}`);
            
            document.getElementById('adjUserEmail').value = '';
            document.getElementById('adjAmount').value = '';
        }

        loadDeposits();
    </script>
</body>
</html>
