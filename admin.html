<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Admin Control Panel - Realona</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .admin-container { max-width: 900px; margin: 20px auto; padding: 15px; }
        .admin-card { background: #161b22; border: 1px solid #30363d; border-radius: 12px; padding: 20px; margin-bottom: 20px; text-align: left; }
        .tab-buttons { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
        .tab-btn { background: #21262d; border: 1px solid #30363d; color: #8b949e; padding: 10px 16px; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .tab-btn.active { background: #1f6feb; color: #fff; border-color: #1f6feb; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-size: 13px; color: #8b949e; margin-bottom: 5px; }
        .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 10px; background: #0d1117; border: 1px solid #30363d; color: #c9d1d9; border-radius: 6px; box-sizing: border-box; }
        .btn-admin { background: #238636; color: #fff; border: none; padding: 10px 16px; border-radius: 6px; font-weight: bold; cursor: pointer; }
        .btn-danger { background: #da3633; color: #fff; border: none; padding: 10px 16px; border-radius: 6px; font-weight: bold; cursor: pointer; }
        .table-custom { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 13px; }
        .table-custom th, .table-custom td { border: 1px solid #30363d; padding: 10px; text-align: left; color: #c9d1d9; }
        .table-custom th { background: #0d1117; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); justify-content: center; align-items: center; z-index: 1000; }
        .modal-content { background: #161b22; border: 1px solid #30363d; padding: 20px; border-radius: 8px; width: 90%; max-width: 500px; }
    </style>
</head>
<body>
    <nav>
        <a href="index.html">Home</a>
        <a href="sell.html">Sell</a>
        <a href="dashboard.html">Dashboard</a>
        <a href="wallet.html">Wallet</a>
        <a href="admin.html" style="color:#58a6ff;">Admin Panel</a>
    </nav>
    <div class="admin-container">
        <h2 style="color:#c9d1d9; margin-bottom:5px;">🛡️ Admin Control Center</h2>
        <p style="color:#8b949e; font-size:13px; margin-bottom:20px;">Tier 1 Critical Escrow & Dispute Resolution Management</p>

        <div class="tab-buttons">
            <button class="tab-btn active" onclick="switchTab('disputes')">1. Escrow & Disputes</button>
            <button class="tab-btn" onclick="switchTab('wallet')">2. Manual Wallet Adjustments</button>
        </div>

        <div id="tabDisputes" class="admin-card">
            <h3 style="margin-top:0; color:#c9d1d9;">Active Trade Disputes</h3>
            <table class="table-custom">
                <thead>
                    <tr>
                        <th>Trade ID</th>
                        <th>Status</th>
                        <th>Amount</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="disputesTableBody">
                    <tr>
                        <td>#TRD-9021</td>
                        <td style="color:#e3b341;">Active Escrow</td>
                        <td>₦4,000</td>
                        <td>
                            <button onclick="viewChat('TRD-9021')" class="btn-admin" style="padding:5px 8px; font-size:11px;">View Chat</button>
                            <button onclick="resolveTrade('TRD-9021', 'refund')" class="btn-danger" style="padding:5px 8px; font-size:11px;">Force Refund</button>
                            <button onclick="resolveTrade('TRD-9021', 'release')" class="btn-admin" style="padding:5px 8px; font-size:11px;">Force Release</button>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
        <div id="tabWallet" class="admin-card" style="display:none;">
            <h3 style="margin-top:0; color:#c9d1d9;">Manual Wallet Adjustment</h3>
            <form onsubmit="submitWalletAdjustment(event)">
                <div class="form-group">
                    <label>User Email</label>
                    <input type="email" id="adjUserEmail" required placeholder="user@demo.com">
                </div>
                <div class="form-group">
                    <label>Adjustment Type</label>
                    <select id="adjType">
                        <option value="add">Add Funds (Credit)</option>
                        <option value="subtract">Subtract Funds (Debit)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Amount (₦)</label>
                    <input type="number" id="adjAmount" required placeholder="5000">
                </div>
                <div class="form-group">
                    <label>Reason / Audit Note</label>
                    <textarea id="adjReason" required placeholder="Compensating for deposit gateway bug..."></textarea>
                </div>
                <button type="submit" class="btn-admin">Execute Adjustment</button>
            </form>
        </div>
    </div>

    <div id="chatModal" class="modal">
        <div class="modal-content">
            <h3 style="margin-top:0; color:#c9d1d9;">💬 Dispute Chat Log</h3>
            <div id="modalChatLogs" style="background:#0d1117; border:1px solid #30363d; padding:10px; border-radius:6px; height:200px; overflow-y:auto; font-size:12px; color:#c9d1d9; margin-bottom:15px;"></div>
            <button onclick="closeModal()" class="btn-admin" style="width:100%;">Close Viewer</button>
        </div>
    </div>

    <script>
        let currentUser = JSON.parse(localStorage.getItem('realonaCurrentUser') || 'null');
        if (!currentUser || !currentUser.isAdmin) {
            alert('⛔ Access Denied: Administrator privileges required.');
            window.location.href = 'auth.html';
        }

        function switchTab(tab) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('tabDisputes').style.display = tab === 'disputes' ? 'block' : 'none';
            document.getElementById('tabWallet').style.display = tab === 'wallet' ? 'block' : 'none';
            event.target.classList.add('active');
        }

        function viewChat(tradeId) {
            document.getElementById('chatModal').style.display = 'flex';
            let chatLogs = JSON.parse(localStorage.getItem(`realona_chat_0_admin`) || '[]');
            let box = document.getElementById('modalChatLogs');
            box.innerHTML = chatLogs.length > 0 ? chatLogs.map(m => `<div><strong>${m.sender}:</strong> ${m.text}</div>`).join('<br>') : '<div>System: Escrow room opened. Funds secured.</div>';
        }

        function closeModal() {
            document.getElementById('chatModal').style.display = 'none';
        }

        function resolveTrade(tradeId, action) {
            let reason = prompt(`Enter reason for Force ${action.toUpperCase()}:`);
            if (!reason) return;
            alert(`✅ Trade #${tradeId} successfully forced to ${action}ed.`);
            location.reload();
        }

        function submitWalletAdjustment(e) {
            e.preventDefault();
            let userEmail = document.getElementById('adjUserEmail').value;
            let type = document.getElementById('adjType').value;
            let amount = parseFloat(document.getElementById('adjAmount').value);
            let currentWallet = parseFloat(localStorage.getItem('realona_wallet_' + userEmail) || '0');
            
            if (type === 'add') currentWallet += amount;
            else currentWallet = Math.max(0, currentWallet - amount);

            localStorage.setItem('realona_wallet_' + userEmail, '₦' + currentWallet);
            alert(`✅ Successfully ${type}ed ₦${amount} for ${userEmail}. New balance: ₦${currentWallet}`);
            document.getElementById('adjUserEmail').value = '';
            document.getElementById('adjAmount').value = '';
            document.getElementById('adjReason').value = '';
        }
    </script>
</body>
</html>
