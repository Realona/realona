<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Account Management - Realona</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .auth-container { max-width: 450px; margin: 30px auto; padding: 20px; }
        .auth-card { background: #161b22; border: 1px solid #30363d; border-radius: 12px; padding: 25px; }
        .tab-group { display: flex; gap: 10px; margin-bottom: 20px; }
        .auth-tab { flex: 1; padding: 10px; background: #21262d; border: 1px solid #30363d; color: #8b949e; border-radius: 6px; cursor: pointer; font-weight: bold; text-align: center; }
        .auth-tab.active { background: #238636; color: #fff; border-color: #238636; }
        .form-group { margin-bottom: 15px; text-align: left; }
        .form-group label { display: block; font-size: 13px; color: #8b949e; margin-bottom: 5px; }
        .form-group input { width: 100%; padding: 10px; background: #0d1117; border: 1px solid #30363d; color: #c9d1d9; border-radius: 6px; box-sizing: border-box; }
        .btn-submit { width: 100%; padding: 12px; background: #238636; color: #fff; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .btn-logout { width: 100%; padding: 12px; background: #da3633; color: #fff; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 15px; }
        .profile-info { background: #0d1117; border: 1px solid #30363d; border-radius: 8px; padding: 12px; margin-bottom: 10px; }
        .profile-info label { font-size: 11px; color: #8b949e; display: block; }
        .profile-info div { font-size: 15px; font-weight: bold; color: #c9d1d9; margin-top: 2px; }
    </style>
</head>
<body>
    <nav>
        <a href="index.html">Home</a>
        <a href="sell.html">Sell</a>
        <a href="dashboard.html">Dashboard</a>
        <a href="wallet.html">Wallet</a>
        <a href="auth.html" style="color:#58a6ff;" id="navAuth">Account</a>
    </nav>
    <div class="auth-container">
        <div id="profileBox" class="auth-card" style="display:none;">
            <h2 style="margin-bottom: 5px; color:#c9d1d9;">👤 Account Profile</h2>
            <div class="profile-info">
                <label>Username / Account Name</label>
                <div id="profUsername">-</div>
            </div>
            <div class="profile-info">
                <label>Email Address</label>
                <div id="profEmail">-</div>
            </div>
            <div id="adminLinkArea" style="margin-top:15px; display:none;">
                <a href="admin.html" style="display:block; text-align:center; background:#1f6feb; color:#fff; padding:10px; border-radius:6px; text-decoration:none; font-weight:bold;">🛡️ Open Admin Panel</a>
            </div>
            <button onclick="handleLogout()" class="btn-logout">🚪 Sign Out</button>
        </div>

        <div id="authFormsBox" class="auth-card">
            <div class="tab-group">
                <div id="tabLogin" class="auth-tab active" onclick="switchTab('login')">Sign In</div>
                <div id="tabRegister" class="auth-tab" onclick="switchTab('register')">Register</div>
            </div>

            <!-- Login Form (Empty Placeholders) -->
            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" id="loginEmail" required placeholder="Enter your email">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="loginPass" required placeholder="••••••••">
                </div>
                <button type="submit" class="btn-submit">Sign In</button>
            </form>

            <!-- Registration Form -->
            <form id="registerForm" onsubmit="handleRegister(event)" style="display:none;">
                <div class="form-group">
                    <label>Username / Full Name</label>
                    <input type="text" id="regUsername" required placeholder="e.g. KayKay">
                </div>
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" id="regEmail" required placeholder="yourname@gmail.com">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="regPass" required placeholder="Create a password">
                </div>
                <button type="submit" class="btn-submit">Create Account</button>
            </form>
        </div>
    </div>
    <script>
        function checkSession() {
            let user = JSON.parse(localStorage.getItem('realonaCurrentUser') || 'null');
            if (user && user.email) {
                document.getElementById('profileBox').style.display = 'block';
                document.getElementById('authFormsBox').style.display = 'none';
                document.getElementById('profUsername').innerText = user.username + (user.isAdmin ? ' 👑 (Admin)' : '');
                document.getElementById('profEmail').innerText = user.email;
                document.getElementById('navAuth').innerText = '👤 ' + user.username;
                if (user.isAdmin) {
                    document.getElementById('adminLinkArea').style.display = 'block';
                }
            } else {
                document.getElementById('profileBox').style.display = 'none';
                document.getElementById('authFormsBox').style.display = 'block';
            }
        }

        function switchTab(tab) {
            document.getElementById('tabLogin').classList.toggle('active', tab === 'login');
            document.getElementById('tabRegister').classList.toggle('active', tab === 'register');
            document.getElementById('loginForm').style.display = tab === 'login' ? 'block' : 'none';
            document.getElementById('registerForm').style.display = tab === 'register' ? 'block' : 'none';
        }

        function handleRegister(e) {
            e.preventDefault();
            let username = document.getElementById('regUsername').value.trim();
            let email = document.getElementById('regEmail').value.trim().toLowerCase();
            let pass = document.getElementById('regPass').value;

            let users = JSON.parse(localStorage.getItem('realonaUsers') || '[]');
            if (users.find(u => u.email === email)) {
                alert('An account with this email already exists!');
                return;
            }

            let newUser = { username, email, pass, isAdmin: false };
            users.push(newUser);
            localStorage.setItem('realonaUsers', JSON.stringify(users));
            localStorage.setItem('realonaCurrentUser', JSON.stringify(newUser));
            
            // Initialize separate user balance
            if (!localStorage.getItem('realona_wallet_' + email)) {
                localStorage.setItem('realona_wallet_' + email, '0');
            }

            alert('Account created successfully! Welcome ' + username + '.');
            checkSession();
            window.location.href = 'dashboard.html';
        }

        function handleLogin(e) {
            e.preventDefault();
            let email = document.getElementById('loginEmail').value.trim().toLowerCase();
            let passVal = document.getElementById('loginPass').value;

            if (email === 'realonabusinessexchange@gmail.com' && passVal === 'Kolade1642@#') {
                let adminUser = { username: 'Realona Admin', email: email, isAdmin: true };
                localStorage.setItem('realonaCurrentUser', JSON.stringify(adminUser));
                alert('👑 Admin login successful!');
                window.location.href = 'admin.html';
                return;
            }

            let users = JSON.parse(localStorage.getItem('realonaUsers') || '[]');
            let found = users.find(u => u.email === email && u.pass === passVal);

            if (found) {
                localStorage.setItem('realonaCurrentUser', JSON.stringify(found));
                alert('Welcome back, ' + found.username + '!');
                checkSession();
                window.location.href = 'dashboard.html';
            } else {
                alert('Invalid email or password!');
            }
        }

        function handleLogout() {
            localStorage.removeItem('realonaCurrentUser');
            window.location.reload();
        }

        checkSession();
    </script>
</body>
</html>
