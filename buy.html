<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Escrow Room - Realona</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .escrow-container { max-width: 600px; margin: 20px auto; padding: 0 15px; text-align: left; }
        .escrow-card { background: #161b22; border: 1px solid #30363d; border-radius: 12px; padding: 20px; margin-bottom: 15px; }
        .chat-box { background: #0d1117; border: 1px solid #30363d; border-radius: 8px; height: 250px; overflow-y: auto; padding: 12px; margin-bottom: 15px; display: flex; flex-direction: column; gap: 8px; }
        .chat-msg { padding: 8px 12px; border-radius: 6px; max-width: 80%; font-size: 13px; }
        .chat-msg.buyer { background: #1f6feb; color: #fff; align-self: flex-end; }
        .chat-msg.seller { background: #21262d; border: 1px solid #30363d; color: #c9d1d9; align-self: flex-start; }
        .chat-msg.system { background: #23863622; border: 1px solid #238636; color: #3fb950; align-self: center; text-align: center; width: 100%; font-size: 12px; }
        .chat-input-area { display: flex; gap: 8px; }
        .chat-input-area input { flex: 1; padding: 10px; background: #0d1117; border: 1px solid #30363d; color: #c9d1d9; border-radius: 6px; }
        .btn-send { background: #238636; color: #fff; border: none; padding: 10px 16px; border-radius: 6px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <nav>
        <a href="index.html">Home</a>
        <a href="sell.html">Sell</a>
        <a href="dashboard.html">Dashboard</a>
        <a href="wallet.html">Wallet</a>
        <a href="auth.html">Account</a>
    </nav>
    <div class="escrow-container">
        <a href="index.html" style="color:#58a6ff; font-size:12px; text-decoration:none; display:inline-block; margin-bottom:15px;">← Back to Marketplace</a>
        
        <div class="escrow-card">
            <h2 style="color:#c9d1d9; margin-top:0;">🛡️ Escrow Negotiation Room</h2>
            <p style="color:#8b949e; font-size:12px;">Secure chat room between buyer, seller, and Realona escrow protection.</p>
            
            <div id="listingDetails" style="background:#0d1117; border:1px solid #30363d; padding:12px; border-radius:8px; margin-bottom:15px;">
                <h3 id="itemTitle" style="margin:0 0 5px 0; color:#c9d1d9; font-size:15px;">Loading item...</h3>
                <div id="itemPrice" style="color:#58a6ff; font-weight:bold; font-size:14px;">₦0</div>
            </div>

            <!-- Chat Box -->
            <div class="chat-box" id="chatMessages"></div>

            <div class="chat-input-area">
                <input type="text" id="chatInput" placeholder="Type a message to the counterparty..." onkeypress="if(event.key==='Enter') sendMessage()">
                <button onclick="sendMessage()" class="btn-send">Send</button>
            </div>
        </div>
    </div>
    <script>
        let urlParams = new URLSearchParams(window.location.search);
        let listingId = urlParams.get('id');
        let currentUser = JSON.parse(localStorage.getItem('realonaCurrentUser') || 'null');

        if (!currentUser || !currentUser.email) {
            alert('Please sign in to access escrow rooms.');
            window.location.href = 'auth.html';
        }

        let listings = JSON.parse(localStorage.getItem('realonaListings') || '[]');
        let item = listings[listingId];

        if (!item) {
            alert('Listing not found!');
            window.location.href = 'index.html';
        }

        document.getElementById('itemTitle').innerText = item.title;
        document.getElementById('itemPrice').innerText = item.price;

        let tradeId = 'TRADE-' + listingId;
        let buyerEmail = currentUser.email.toLowerCase().trim();
        let sellerEmail = (item.sellerEmail || '').toLowerCase().trim();

        // Ensure buyer wallet deduction happens once upon entering room if not already done
        let walletKey = 'realona_wallet_' + buyerEmail;
        let currentBal = parseFloat(localStorage.getItem(walletKey) || '0');
        let itemPriceNum = parseFloat(item.price.replace(/[^0-9.-]+/g, '')) || 0;

        let escrowStatusKey = 'realona_escrow_deducted_' + tradeId + '_' + buyerEmail;
        if (!localStorage.getItem(escrowStatusKey)) {
            if (currentBal >= itemPriceNum) {
                let newBal = currentBal - itemPriceNum;
                localStorage.setItem(walletKey, newBal.toString());
                localStorage.setItem(escrowStatusKey, 'true');
            } else {
                alert('Insufficient wallet balance to fund escrow! Please fund your wallet.');
                window.location.href = 'wallet.html';
            }
        }

        function loadChat() {
            let messages = JSON.parse(localStorage.getItem('realona_chat_' + tradeId) || '[]');
            let chatBox = document.getElementById('chatMessages');
            
            let html = `<div class="chat-msg system">🔒 Escrow active. Funds locked securely for ${item.title}.</div>`;
            if (currentUser.email === sellerEmail) {
                html += `<div class="chat-msg system">🔑 Seller Credentials: ${item.credentials || 'Contact buyer in chat'}</div>`;
            } else {
                html += `<div class="chat-msg system">🔑 Credentials Unlocked: ${item.credentials || 'Pending seller release'}</div>`;
            }

            html += messages.map(m => {
                let isMe = m.sender === currentUser.email;
                let cssClass = isMe ? 'buyer' : 'seller';
                return `<div class="chat-msg ${cssClass}"><strong>${m.senderName}:</strong> ${m.text}</div>`;
            }).join('');

            chatBox.innerHTML = html;
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function sendMessage() {
            let input = document.getElementById('chatInput');
            let text = input.value.trim();
            if (!text) return;

            let messages = JSON.parse(localStorage.getItem('realona_chat_' + tradeId) || '[]');
            messages.push({
                sender: currentUser.email,
                senderName: currentUser.username || 'Trader',
                text: text,
                time: new Date().toLocaleTimeString()
            });

            localStorage.setItem('realona_chat_' + tradeId, JSON.stringify(messages));
            input.value = '';
            loadChat();
        }

        loadChat();
        setInterval(loadChat, 3000); // Auto-refresh chat every 3s for both buyer & seller
    </script>
</body>
</html>
