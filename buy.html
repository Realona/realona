    <script>
        function initCheckout() {
            // Rule 1: Require login for checkout
            let currentUser = JSON.parse(localStorage.getItem('realonaCurrentUser') || 'null');
            if (!currentUser || !currentUser.email) {
                alert('You must sign in or register before making a purchase.');
                window.location.href = 'auth.html';
                return;
            }

            const urlParams = new URLSearchParams(window.location.search);
            const id = urlParams.get('id');
            let listings = JSON.parse(localStorage.getItem('realonaListings') || '[]');
            let item = listings[id];

            if (!item) {
                alert('Listing not found!');
                window.location.href = 'index.html';
                return;
            }

            // Rule 2: Prevent buying your own listing
            if (item.sellerEmail === currentUser.email) {
                alert('Security Error: You cannot purchase your own account listing!');
                window.location.href = 'index.html';
                return;
            }

            document.getElementById('buyTitle').innerText = item.title;
            document.getElementById('buyInfo').innerText = item.details;
            document.getElementById('buyPrice').innerText = item.price;
        }

        function confirmEscrowPurchase() {
            alert('🔒 Funds secured in Realona Escrow! Seller credentials have been unlocked in your dashboard.');
            window.location.href = 'dashboard.html';
        }

        initCheckout();
    </script>
</body>
</html>
