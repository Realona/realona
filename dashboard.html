<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dashboard - Realona</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav>
        <a href="index.html">Home</a>
        <a href="sell.html">Sell Account</a>
        <a href="dashboard.html" style="color:#58a6ff;">Dashboard</a>
        <a href="wallet.html">Wallet</a>
        <a href="auth.html">Account</a>
    </nav>
    <div class="sell-container">
        <h2 id="dashWelcome" style="margin-bottom:5px; color:#c9d1d9;">Welcome back! 👋</h2>
        <p style="color:#8b949e; font-size:13px; margin-bottom:20px;">Manage your trades, listings, and wallet from here.</p>

        <div style="display:grid; grid-template-columns: 1fr 1fr; gap:15px; margin-bottom:20px;">
            <div style="background:#161b22; border:1px solid #30363d; padding:15px; border-radius:10px;">
                <span style="font-size:12px; color:#8b949e;">Wallet Balance</span>
                <div id="dashWallet" style="font-size:22px; font-weight:bold; color:#58a6ff; margin-top:5px;">₦0</div>
            </div>
            <div style="background:#161b22; border:1px solid #30363d; padding:15px; border-radius:10px;">
                <span style="font-size:12px; color:#8b949e;">Your Active Listings</span>
                <div id="dashActiveCount" style="font-size:22px; font-weight:bold; color:#3fb950; margin-top:5px;">0</div>
            </div>
        </div>

        <div style="background:#161b22; border:1px solid #30363d; border-radius:12px; padding:20px; margin-bottom:20px;">
            <h3 style="margin-top:0; color:#c9d1d9;">📦 Your Active Listings</h3>
            <div id="myListingsContainer"></div>
        </div>

        <div style="background:#161b22; border:1px solid #30363d; border-radius:12px; padding:20px;">
            <h3 style="margin-top:0; color:#c9d1d9;">Quick Actions</h3>
            <div style="display:flex; gap:10px; flex-wrap:wrap;">
                <a href="sell.html" style="background:#238636; color:#fff; padding:10px 15px; border-radius:6px; text-decoration:none; font-weight:bold; font-size:13px;">+ New Listing</a>
                <a href="index.html" style="background:#21262d; border:1px solid #30363d; color:#58a6ff; padding:10px 15px; border-radius:6px; text-decoration:none; font-size:13px;">🔍 Marketplace</a>
            </div>
        </div>
    </div>
    <script>
        function loadDashboard() {
            let currentUser = JSON.parse(localStorage.getItem('realonaCurrentUser') || 'null');
            if (!currentUser || !currentUser.email) {
                alert('Please sign in to view your dashboard.');
                window.location.href = 'auth.html';
                return;
            }

            document.getElementById('dashWelcome').innerText = `Welcome back, ${currentUser.username || 'Trader'}! 👋`;

            let wallet = localStorage.getItem('realona_wallet_' + currentUser.email) || '₦0';
            document.getElementById('dashWallet').innerText = wallet;

            let listings = JSON.parse(localStorage.getItem('realonaListings') || '[]');
            // Filter strictly by logged-in user email
            let myListings = listings.map((item, idx) => ({ ...item, globalIndex: idx })).filter(item => item.sellerEmail === currentUser.email);

            document.getElementById('dashActiveCount').innerText = myListings.length;

            let container = document.getElementById('myListingsContainer');
            if (myListings.length === 0) {
                container.innerHTML = `<p style="color:#8b949e; font-size:13px; text-align:center; padding:15px;">You have no active listings yet. Click "+ New Listing" above!</p>`;
            } else {
                container.innerHTML = myListings.map(item => `
                    <div style="background:#0d1117; border:1px solid #30363d; padding:12px; border-radius:8px; margin-bottom:10px; display:flex; justify-content:space-between; align-items:center;">
                        <div>
                            <strong style="color:#c9d1d9; font-size:14px;">${item.title}</strong>
                            <div style="color:#8b949e; font-size:12px;">${item.details} • <span style="color:#58a6ff; font-weight:bold;">${item.price}</span></div>
                        </div>
                        <div style="display:flex; gap:6px;">
                            <a href="listing.html?id=${item.globalIndex}" style="background:#21262d; border:1px solid #30363d; color:#58a6ff; padding:6px 10px; border-radius:6px; font-size:11px; text-decoration:none;">View</a>
                            <button onclick="deleteListing(${item.globalIndex})" style="background:#da3633; color:#fff; border:none; padding:6px 10px; border-radius:6px; font-size:11px; cursor:pointer;">Delete</button>
                        </div>
                    </div>
                `).join('');
            }
        }

        function deleteListing(globalIndex) {
            if (confirm('Are you sure you want to delete this listing?')) {
                let listings = JSON.parse(localStorage.getItem('realonaListings') || '[]');
                listings.splice(globalIndex, 1);
                localStorage.setItem('realonaListings', JSON.stringify(listings));
                loadDashboard();
            }
        }

        loadDashboard();
    </script>
</body>
</html>

    <script>
        function loadDashboard() {
            let currentUser = JSON.parse(localStorage.getItem('realonaCurrentUser') || 'null');
            if (!currentUser || !currentUser.email) {
                alert('Please sign in to view your dashboard.');
                window.location.href = 'auth.html';
                return;
            }

            document.getElementById('dashWelcome').innerText = `Welcome back, ${currentUser.username || 'Trader'}! 👋`;

            let wallet = localStorage.getItem('realona_wallet_' + currentUser.email) || '₦0';
            document.getElementById('dashWallet').innerText = wallet;

            let listings = JSON.parse(localStorage.getItem('realonaListings') || '[]');
            
            // Filter listings so user only sees THEIR own active listings
            let myListings = listings.map((item, idx) => ({ ...item, globalIndex: idx }))
                                     .filter(item => item.sellerEmail === currentUser.email);

            document.getElementById('dashActiveCount').innerText = myListings.length;

            let container = document.getElementById('myListingsContainer');
            if (myListings.length === 0) {
                container.innerHTML = `<p style="color:#8b949e; font-size:12px; text-align:center; padding:10px; margin:0;">You have no active listings yet. Click "+ New Listing" above!</p>`;
            } else {
                container.innerHTML = myListings.map(item => `
                    <div class="item-row">
                        <div>
                            <strong style="color:#c9d1d9; font-size:13px;">${item.title}</strong>
                            <div style="color:#8b949e; font-size:11px; margin-top:2px;">
                                <span class="badge-active">Active</span> • <span style="color:#58a6ff; font-weight:bold;">${item.price}</span>
                            </div>
                        </div>
                        <div style="display:flex; gap:6px;">
                            <a href="listing.html?id=${item.globalIndex}" style="background:#21262d; border:1px solid #30363d; color:#58a6ff; padding:5px 8px; border-radius:4px; font-size:11px; text-decoration:none;">View</a>
                            <button onclick="markAsSold(${item.globalIndex})" style="background:#21262d; border:1px solid #30363d; color:#e3b341; padding:5px 8px; border-radius:4px; font-size:11px; cursor:pointer;">Mark Sold</button>
                            <button onclick="deleteListing(${item.globalIndex})" style="background:#da3633; color:#fff; border:none; padding:5px 8px; border-radius:4px; font-size:11px; cursor:pointer;">Delete</button>
                        </div>
                    </div>
                `).join('');
            }
        }

        function markAsSold(globalIndex) {
            let listings = JSON.parse(localStorage.getItem('realonaListings') || '[]');
            listings[globalIndex].status = 'Sold';
            localStorage.setItem('realonaListings', JSON.stringify(listings));
            alert('Listing marked as sold!');
            loadDashboard();
        }

        function deleteListing(globalIndex) {
            if (confirm('Are you sure you want to delete this listing?')) {
                let listings = JSON.parse(localStorage.getItem('realonaListings') || '[]');
                listings.splice(globalIndex, 1);
                localStorage.setItem('realonaListings', JSON.stringify(listings));
                loadDashboard();
            }
        }

        loadDashboard();
    </script>
</body>
</html>
