<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Seller Dashboard - Realona</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .dash-card { background: #161b22; border: 1px solid #30363d; padding: 15px; border-radius: 10px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
        .badge-active { background: #238636; color: #fff; padding: 3px 8px; border-radius: 12px; font-size: 11px; }
        .badge-escrow { background: #d29922; color: #000; padding: 3px 8px; border-radius: 12px; font-size: 11px; font-weight: bold; }
        .badge-sold { background: #8b949e; color: #fff; padding: 3px 8px; border-radius: 12px; font-size: 11px; }
        .btn-action { background: #21262d; border: 1px solid #30363d; color: #c9d1d9; padding: 6px 10px; border-radius: 6px; font-size: 12px; cursor: pointer; margin-left: 5px; }
        .btn-delete { background: #da3633; color: #fff; border: none; }
        .log-box { background: #0d1117; border: 1px solid #30363d; padding: 12px; border-radius: 8px; font-size: 13px; color: #c9d1d9; margin-bottom: 8px; }
    </style>
</head>
<body>
    <nav>
        <a href="index.html">Home</a>
        <a href="sell.html">Sell Account</a>
        <a href="dashboard.html">Dashboard</a>
        <a href="wallet.html">Wallet</a>
        <a href="about.html">About</a>
    </nav>
    <div class="sell-container">
        <h2>Seller Dashboard</h2>
        <p style="color:#8b949e; margin-bottom: 20px;">Manage your active listings and trade notifications.</p>

        <h3 style="margin-bottom: 10px;">📦 Your Account Listings</h3>
        <div id="listingsList"></div>

        <h3 style="margin-top: 25px; margin-bottom: 10px;">🔔 Escrow Activity & Trade Logs</h3>
        <div id="activityLogs"></div>
    </div>
    <script>
        function loadDashboard() {
            let list = JSON.parse(localStorage.getItem('realonaListings') || '[]');
            let container = document.getElementById('listingsList');

            if (list.length === 0) {
                container.innerHTML = `<div style="text-align:center; color:#8b949e; padding: 20px 0;">You have no accounts listed for sale yet.<br><br><a href="sell.html" class="btn-escrow" style="text-decoration:none; display:inline-block;">+ Create a Listing</a></div>`;
            } else {
                container.innerHTML = list.map((item, index) => {
                    let badgeClass = 'badge-active';
                    if (item.status === 'In Escrow') badgeClass = 'badge-escrow';
                    if (item.status === 'Sold') badgeClass = 'badge-sold';

                    return `
                        <div class="dash-card">
                            <div>
                                <div style="display:flex; align-items:center; gap:8px;">
                                    <strong>${item.title}</strong>
                                    <span class="${badgeClass}">${item.status || 'Active'}</span>
                                </div>
                                <p style="font-size:13px; color:#8b949e; margin:4px 0 0 0;">${item.price} • ${item.category}</p>
                            </div>
                            <div>
                                <button class="btn-action" onclick="toggleStatus(${index})">${item.status === 'Sold' ? 'Mark Active' : 'Mark Sold'}</button>
                                <button class="btn-action btn-delete" onclick="deleteListing(${index})">Delete</button>
                            </div>
                        </div>
                    `;
                }).join('');
            }

            renderLogs();
        }

        function renderLogs() {
            let logs = JSON.parse(localStorage.getItem('realonaLogs') || '[]');
            let logContainer = document.getElementById('activityLogs');

            if (logs.length === 0) {
                logContainer.innerHTML = `<p style="color:#8b949e; font-size:13px;">No trade activity recorded yet.</p>`;
                return;
            }

            logContainer.innerHTML = logs.map(l => `
                <div class="log-box">
                    <div style="display:flex; justify-content:space-between; margin-bottom:4px;">
                        <strong style="color:#58a6ff;">${l.title}</strong>
                        <span style="font-size:11px; color:#8b949e;">${l.time}</span>
                    </div>
                    <div>${l.message}</div>
                </div>
            `).join('');
        }

        function toggleStatus(index) {
            let list = JSON.parse(localStorage.getItem('realonaListings') || '[]');
            let oldStatus = list[index].status || 'Active';
            let newStatus = oldStatus === 'Sold' ? 'Active' : 'Sold';
            list[index].status = newStatus;
            localStorage.setItem('realonaListings', JSON.stringify(list));

            // Add activity log
            addLog('Status Update', `Listing "${list[index].title}" marked as ${newStatus}.`);
            loadDashboard();
        }

        function deleteListing(index) {
            if (confirm('Are you sure you want to delete this listing?')) {
                let list = JSON.parse(localStorage.getItem('realonaListings') || '[]');
                let title = list[index].title;
                list.splice(index, 1);
                localStorage.setItem('realonaListings', JSON.stringify(list));

                addLog('Listing Removed', `Listing "${title}" was deleted.`);
                loadDashboard();
            }
        }

        function addLog(title, message) {
            let logs = JSON.parse(localStorage.getItem('realonaLogs') || '[]');
            logs.unshift({
                title: title,
                message: message,
                time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
            });
            localStorage.setItem('realonaLogs', JSON.stringify(logs));
        }

        loadDashboard();
    </script>
</body>
</html>
