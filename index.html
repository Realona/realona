<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Realona - Secure Digital Marketplace</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav>
        <a href="index.html">Home</a>
        <a href="sell.html">Sell Account</a>
        <a href="about.html">About</a>
    </nav>
    
    <header class="hero">
        <h1>Realona Marketplace</h1>
        <p>Secure Escrow Platform for eFootball & Social Media Accounts</p>
        <input type="text" placeholder="Search accounts, division, player..." class="search-bar">
    </header>

    <div class="categories">
        <button class="tab active">All</button>
        <button class="tab">eFootball</button>
        <button class="tab">Social Media</button>
    </div>

    <main class="listings-grid" id="listingsContainer">
        <!-- Default Mock Listings -->
        <div class="card">
            <span class="tag">Division 2</span>
            <h3>eFootball Pro Account</h3>
            <p class="price">₦14,999</p>
            <p class="details">3200 OVR • Top Player: Bellingham 107</p>
            <button class="btn-escrow">Buy Now - Start Escrow</button>
        </div>
        
        <div class="card">
            <span class="tag">Verified</span>
            <h3>TikTok Monetized Page</h3>
            <p class="price">₦25,000</p>
            <p class="details">50k Followers • Clean Analytics</p>
            <button class="btn-escrow">Buy Now - Start Escrow</button>
        </div>
    </main>

    <script>
        window.addEventListener('DOMContentLoaded', () => {
            const container = document.getElementById('listingsContainer');
            const savedListings = JSON.parse(localStorage.getItem('realonaListings') || '[]');

            savedListings.forEach(item => {
                const card = document.createElement('div');
                card.className = 'card';
                
                let imgHtml = '';
                if (item.image) {
                    imgHtml = `<img src="${item.image}" style="width: 100%; height: 140px; object-fit: cover; border-radius: 8px; margin-bottom: 10px;">`;
                }

                card.innerHTML = `
                    ${imgHtml}
                    <span class="tag">${item.tag}</span>
                    <h3>${item.title}</h3>
                    <p class="price">${item.price}</p>
                    <p class="details">${item.details}</p>
                    <button class="btn-escrow">Buy Now - Start Escrow</button>
                `;
                container.prepend(card);
            });
        });
    </script>
</body>
</html>
