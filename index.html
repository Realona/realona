<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Marketplace - Realona</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .market-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; margin-top: 20px; }
        .item-card { background: #161b22; border: 1px solid #30363d; border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; }
        .item-img { width: 100%; height: 160px; object-fit: cover; background: #0d1117; border-bottom: 1px solid #30363d; }
        .item-body { padding: 15px; display: flex; flex-direction: column; flex: 1; }
        .item-title { font-size: 15px; font-weight: bold; color: #c9d1d9; margin-bottom: 6px; }
        .item-price { color: #58a6ff; font-weight: bold; font-size: 16px; margin-bottom: 12px; }
        .btn-buy { background: #238636; color: #fff; text-decoration: none; text-align: center; padding: 10px; border-radius: 6px; font-weight: bold; font-size: 13px; margin-top: auto; }
    </style>
</head>
<body>
    <nav>
        <a href="index.html" style="color:#58a6ff;">Home</a>
        <a href="sell.html">Sell</a>
        <a href="dashboard.html">Dashboard</a>
        <a href="wallet.html">Wallet</a>
        <a href="auth.html">Account</a>
    </nav>
    <div style="max-width:900px; margin:20px auto; padding:0 15px;">
        <h2 style="color:#c9d1d9; margin-bottom:5px;">🎮 Realona Escrow Marketplace</h2>
        <p style="color:#8b949e; font-size:13px; margin-bottom:20px;">Buy and sell digital assets, gaming accounts, and services securely.</p>

        <div class="market-grid" id="marketplaceContainer"></div>
    </div>

    <script>
        function loadMarketplace() {
            let listings = JSON.parse(localStorage.getItem('realonaListings') || '[]');
            let activeListings = listings.map((item, idx) => ({ ...item, globalIndex: idx }))
                                         .filter(item => item.status === 'Active' || !item.status);

            let container = document.getElementById('marketplaceContainer');

            if (activeListings.length === 0) {
                container.innerHTML = `
                    <div style="grid-column: 1/-1; text-align:center; padding:40px 20px; color:#8b949e; background:#161b22; border:1px solid #30363d; border-radius:12px;">
                        <h3>No Active Listings Available</h3>
                        <p style="font-size:13px;">Be the first to list an item for sale on Realona!</p>
                        <a href="sell.html" style="display:inline-block; margin-top:10px; background:#238636; color:#fff; padding:10px 16px; border-radius:6px; text-decoration:none; font-weight:bold; font-size:13px;">+ Create Listing</a>
                    </div>
                `;
                return;
            }

            container.innerHTML = activeListings.map(item => {
                let imgSrc = (item.image && item.image.trim().length > 0) ? item.image : 'https://via.placeholder.com/300x160/0d1117/8b949e?text=No+Screenshot';
                return `
                    <div class="item-card">
                        <img src="${imgSrc}" class="item-img" onerror="this.src='https://via.placeholder.com/300x160/0d1117/8b949e?text=Image+Load+Error'">
                        <div class="item-body">
                            <div class="item-title">${item.title}</div>
                            <div class="item-price">${item.price}</div>
                            <a href="buy.html?id=${item.globalIndex}" class="btn-buy">Buy / Open Escrow</a>
                        </div>
                    </div>
                `;
            }).join('');
        }

        loadMarketplace();
    </script>
</body>
</html>
