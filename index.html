<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Marketplace - Realona Exchange</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav>
        <a href="index.html" style="color:#58a6ff;">Home</a>
        <a href="sell.html">Sell Account</a>
        <a href="dashboard.html">Dashboard</a>
        <a href="wallet.html">Wallet</a>
        <a href="auth.html" id="navAuthLink">Account</a>
    </nav>
    <div class="sell-container">
        <h2>Marketplace Listings</h2>

        <!-- Filters Grid -->
        <div style="background:#161b22; border:1px solid #30363d; padding:15px; border-radius:10px; margin-bottom:20px;">
            <div style="display:flex; gap:8px; margin-bottom:12px;">
                <button style="background:#238636; color:#fff; border:none; padding:6px 12px; border-radius:6px; font-size:12px; font-weight:bold;">🎮 eFootball</button>
                <button style="background:#21262d; color:#8b949e; border:1px solid #30363d; padding:6px 12px; border-radius:6px; font-size:12px;">📱 Social Media</button>
            </div>
            <input type="text" id="searchInput" placeholder="Search accounts..." style="width:100%; padding:10px; background:#0d1117; border:1px solid #30363d; color:#c9d1d9; border-radius:6px; margin-bottom:10px; box-sizing:border-box;">
            <div style="display:flex; gap:10px;">
                <select id="divisionFilter" style="flex:1; padding:8px; background:#0d1117; border:1px solid #30363d; color:#c9d1d9; border-radius:6px;">
                    <option value="">All Divisions</option>
                    <option value="Division 1">Division 1</option>
                    <option value="Division 2">Division 2</option>
                    <option value="Division 3">Division 3</option>
                </select>
                <input type="number" id="ratingFilter" placeholder="Min Rating (e.g. 3000)" style="flex:1; padding:8px; background:#0d1117; border:1px solid #30363d; color:#c9d1d9; border-radius:6px;">
            </div>
        </div>

        <!-- Listings Container -->
        <div id="listingsGrid"></div>
    </div>
    <script>
        function loadMarketplace() {
            // Update Auth Nav link if logged in
            let currentUser = JSON.parse(localStorage.getItem('realonaCurrentUser') || '{}');
            let navAuth = document.getElementById('navAuthLink');
            if (currentUser.username) {
                navAuth.innerText = '👤 ' + currentUser.username;
            }

            let defaultListings = [
                { title: 'eFootball Pro Account', details: '3000 OVR • Division 3 • Top Player: Messi', price: '₦4,000', status: 'Active' },
                { title: 'eFootball Pro Account', details: '3000 OVR • Ronaldo', price: '₦3,000', status: 'Active' },
                { title: 'eFootball Pro Account', details: '3000 OVR • Top Player: Messi', price: '₦2,000', status: 'Active' }
            ];

            let savedListings = JSON.parse(localStorage.getItem('realonaListings') || 'null');
            if (!savedListings) {
                localStorage.setItem('realonaListings', JSON.stringify(defaultListings));
                savedListings = defaultListings;
            }

            let container = document.getElementById('listingsGrid');
            let activeOnly = savedListings.filter(item => !item.status || item.status === 'Active');

            if (activeOnly.length === 0) {
                container.innerHTML = `<p style="color:#8b949e; text-align:center;">No accounts available right now.</p>`;
            } else {
                container.innerHTML = activeOnly.map((item, index) => `
                    <div style="background:#161b22; border:1px solid #30363d; border-radius:12px; padding:15px; margin-bottom:15px;">
                        <h3 style="margin:0 0 6px 0; font-size:16px; color:#c9d1d9;">${item.title}</h3>
                        <p style="color:#8b949e; font-size:12px; margin:0 0 12px 0;">${item.details}</p>
                        <div style="display:flex; justify-content:space-between; align-items:center;">
                            <span style="font-size:18px; font-weight:bold; color:#58a6ff;">${item.price}</span>
                            <a href="buy.html?id=${index}" style="background:#21262d; border:1px solid #30363d; color:#58a6ff; padding:6px 12px; border-radius:6px; font-size:12px; text-decoration:none;">View Listing →</a>
                        </div>
                    </div>
                `).join('');
            }
        }

        loadMarketplace();
    </script>
</body>
</html>
