<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Realona - Secure Digital Marketplace</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav>
        <a href="index.html">Home</a>
        <a href="sell.html">Sell Account</a>
        <a href="wallet.html">Wallet</a>
        <a href="about.html">About</a>
    </nav>
    
    <header class="hero">
        <h1>Trade Accounts Without Risk.</h1>
        <p>Realona is Nigeria's trusted marketplace for eFootball & social media accounts with secure escrow.</p>
        <input type="text" id="searchInput" placeholder="Search accounts, title, player..." class="search-bar" oninput="filterListings()">
    </header>

    <div style="max-width: 1200px; margin: 0 auto; padding: 0 20px;">
        <div class="categories" style="display: flex; gap: 10px; margin-bottom: 20px;">
            <button class="tab active" onclick="setCategory('All', this)">All</button>
            <button class="tab" onclick="setCategory('eFootball', this)">eFootball</button>
            <button class="tab" onclick="setCategory('Social Media', this)">Social Media</button>
        </div>

        <div class="form-box" style="margin-bottom: 25px; background: #161b22; border: 1px solid #30363d;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                <h3 style="margin: 0; font-size: 1rem; color: #58a6ff;">🔍 Advanced Filters</h3>
                <button onclick="resetFilters()" style="background: none; border: none; color: #8b949e; cursor: pointer; font-size: 0.85rem;">Reset All</button>
            </div>
            <div class="row-group" style="margin-bottom: 10px;">
                <div class="form-group" style="margin:0;">
                    <label style="font-size:0.8rem; color:#8b949e;">Division Rank</label>
                    <select id="filterDivision" class="search-bar" onchange="filterListings()" style="margin-top:4px;">
                        <option value="">Any division</option>
                        <option>Division 1</option>
                        <option>Division 2</option>
                        <option>Division 3</option>
                        <option>Division 4-10</option>
                    </select>
                </div>
                <div class="form-group" style="margin:0;">
                    <label style="font-size:0.8rem; color:#8b949e;">Player Name</label>
                    <input type="text" id="filterPlayer" placeholder="e.g. Bellingham" class="search-bar" oninput="filterListings()" style="margin-top:4px;">
                </div>
            </div>
        </div>
    </div>

    <main class="listings-grid" id="listingsContainer">
        <!-- Rendered dynamically -->
    </main>
    <script>
        let currentCategory = 'All';

        window.addEventListener('DOMContentLoaded', () => {
            renderListings();
        });

        function setCategory(cat, btn) {
            currentCategory = cat;
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            btn.classList.add('active');
            renderListings();
        }

        function resetFilters() {
            document.getElementById('searchInput').value = '';
            document.getElementById('filterDivision').value = '';
            document.getElementById('filterPlayer').value = '';
            currentCategory = 'All';
            document.querySelectorAll('.tab').forEach((t, i) => {
                if (i === 0) t.classList.add('active');
                else t.classList.remove('active');
            });
            renderListings();
        }

        function renderListings() {
            const container = document.getElementById('listingsContainer');
            const searchVal = document.getElementById('searchInput').value.toLowerCase();
            const divVal = document.getElementById('filterDivision').value.toLowerCase();
            const playerVal = document.getElementById('filterPlayer').value.toLowerCase();

            // Default mock listings combined with saved local listings
            let allListings = [
                {
                    title: 'TikTok Monetized Page',
                    price: '₦25,000',
                    details: '50k Followers • Clean Analytics',
                    tag: 'Social Media',
                    category: 'Social Media',
                    image: ''
                },
                {
                    title: 'eFootball Pro Account',
                    price: '₦14,999',
                    details: '3200 OVR • Top Player: Bellingham 107',
                    tag: 'Division 2',
                    category: 'eFootball',
                    image: ''
                }
            ];

            const saved = JSON.parse(localStorage.getItem('realonaListings') || '[]');
            allListings = saved.concat(allListings);

            const filtered = allListings.filter(item => {
                const cat = item.category || 'eFootball';
                if (currentCategory !== 'All' && cat !== currentCategory) return false;

                const matchSearch = (item.title + ' ' + item.details + ' ' + item.price).toLowerCase().includes(searchVal);
                if (!matchSearch) return false;

                if (divVal && !item.details.toLowerCase().includes(divVal) && !item.tag.toLowerCase().includes(divVal)) return false;
                if (playerVal && !item.details.toLowerCase().includes(playerVal)) return false;

                return true;
            });

            if (filtered.length === 0) {
                container.innerHTML = `<div style="grid-column: 1/-1; text-align: center; color: #8b949e; padding: 40px;">No accounts found matching your filters.</div>`;
                return;
            }

            container.innerHTML = filtered.map((item, index) => {
                let imgHtml = item.image ? `<img src="${item.image}" style="width: 100%; height: 160px; object-fit: cover; border-radius: 8px; margin-bottom: 10px;">` : `<div style="background: #161b22; height: 140px; display: flex; align-items: center; justify-content: center; border-radius: 8px; color: #8b949e; margin-bottom: 10px; border: 1px solid #30363d;">No Screenshot</div>`;

                return `
                    <div class="card clickable" onclick="window.location.href='listing.html?id=${index}'">
                        ${imgHtml}
                        <span class="tag">${item.tag || item.category}</span>
                        <h3>${item.title}</h3>
                        <p class="price">${item.price}</p>
                        <p class="details">${item.details}</p>
                        <button class="btn-escrow">View Details & Escrow</button>
                    </div>
                `;
            }).join('');
        }

        // Hook up search input live filtering
        document.getElementById('searchInput').addEventListener('input', renderListings);
    </script>
</body>
</html>
