<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Realona Marketplace</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav>
        <a href="index.html">Home</a>
        <a href="sell.html">Sell Account</a>
        <a href="dashboard.html">Dashboard</a>
        <a href="wallet.html">Wallet</a>
        <a href="about.html">About</a>
    </nav>
    <header class="hero">
        <h1>Trade Accounts Without Risk.</h1>
        <p>Nigeria's trusted marketplace for eFootball & social media accounts.</p>
        <input type="text" id="searchInput" placeholder="Search accounts..." class="search-bar" oninput="renderListings()">
    </header>

    <div style="max-width: 1000px; margin: 0 auto; padding: 0 15px;">
        <div style="display: flex; gap: 10px; margin-bottom: 15px;">
            <button class="tab active" onclick="setCat('All', this)">All</button>
            <button class="tab" onclick="setCat('eFootball', this)">eFootball</button>
            <button class="tab" onclick="setCat('Social Media', this)">Social Media</button>
        </div>

        <div class="form-box" style="margin-bottom: 20px;">
            <div style="display:flex; justify-between: space-between; align-items:center;">
                <h3 style="margin:0; font-size: 0.95rem;">⚙️ Filters</h3>
                <button onclick="resetFilters()" style="background:none; border:none; color:#8b949e; cursor:pointer;">Reset</button>
            </div>
            
            <!-- eFootball Filters -->
            <div id="efootballFilters" class="row-group" style="margin-top: 10px;">
                <select id="filterDiv" class="search-bar" onchange="renderListings()">
                    <option value="">Any Division</option>
                    <option>Division 1</option>
                    <option>Division 2</option>
                    <option>Division 3</option>
                </select>
                <input type="number" id="minRating" placeholder="Min Rating (e.g. 3000)" class="search-bar" oninput="renderListings()">
                <input type="number" id="maxRating" placeholder="Max Rating (e.g. 3600)" class="search-bar" oninput="renderListings()">
                <input type="text" id="filterPlayer" placeholder="Player Name (e.g. Mbappe)" class="search-bar" oninput="renderListings()">
            </div>

            <!-- Social Media Filters -->
            <div id="socialFilters" class="row-group" style="margin-top: 10px; display: none;">
                <select id="filterPlatform" class="search-bar" onchange="renderListings()">
                    <option value="">All Platforms</option>
                    <option>Instagram</option>
                    <option>TikTok</option>
                    <option>YouTube</option>
                    <option>Twitter/X</option>
                    <option>Facebook</option>
                </select>
            </div>
        </div>
    </div>

    <main class="listings-grid" id="listingsContainer"></main>
    <script>
        let curCat = 'All';

        function setCat(cat, btn) {
            curCat = cat;
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            btn.classList.add('active');
            
            document.getElementById('efootballFilters').style.display = (cat === 'Social Media') ? 'none' : 'flex';
            document.getElementById('socialFilters').style.display = (cat === 'eFootball') ? 'none' : 'flex';
            renderListings();
        }

        function resetFilters() {
            document.getElementById('searchInput').value = '';
            document.getElementById('filterDiv').value = '';
            document.getElementById('minRating').value = '';
            document.getElementById('maxRating').value = '';
            document.getElementById('filterPlayer').value = '';
            document.getElementById('filterPlatform').value = '';
            setCat('All', document.querySelectorAll('.tab')[0]);
        }

        function renderListings() {
            const container = document.getElementById('listingsContainer');
            const search = document.getElementById('searchInput').value.toLowerCase();
            const div = document.getElementById('filterDiv').value.toLowerCase();
            const minR = parseFloat(document.getElementById('minRating').value) || 0;
            const maxR = parseFloat(document.getElementById('maxRating').value) || 99999;
            const player = document.getElementById('filterPlayer').value.toLowerCase();
            const plat = document.getElementById('filterPlatform').value.toLowerCase();

            let all = JSON.parse(localStorage.getItem('realonaListings') || '[]');
            
            let filtered = all.filter(item => {
                let cat = item.category || 'eFootball';
                if (curCat !== 'All' && cat !== curCat) return false;

                let txt = (item.title + ' ' + item.details + ' ' + item.price).toLowerCase();
                if (search && !txt.includes(search)) return false;

                if (cat === 'eFootball') {
                    if (div && !txt.includes(div)) return false;
                    if (player && !txt.includes(player)) return false;
                    let ovr = parseFloat(item.details) || 0;
                    if (ovr && (ovr < minR || ovr > maxR)) return false;
                } else if (cat === 'Social Media') {
                    if (plat && !txt.includes(plat)) return false;
                }
                return true;
            });

            if (!filtered.length) {
                container.innerHTML = `<p style="grid-column:1/-1; text-align:center; color:#8b949e;">No accounts match your filters.</p>`;
                return;
            }

            container.innerHTML = filtered.map((item, idx) => `
                <div class="card clickable" onclick="window.location.href='listing.html?id=${idx}'">
                    ${item.image ? `<img src="${item.image}" style="width:100%; height:140px; object-fit:cover; border-radius:6px; margin-bottom:8px;">` : ''}
                    <span class="tag">${item.tag || item.category}</span>
                    <h3>${item.title}</h3>
                    <p class="price">${item.price}</p>
                    <p class="details">${item.details}</p>
                    <button class="btn-escrow">View Details</button>
                </div>
            `).join('');
        }

        window.addEventListener('DOMContentLoaded', renderListings);
    </script>
</body>
</html>
