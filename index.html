<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Realona Exchange - Escrow Marketplace</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .filter-section { background: #161b22; padding: 15px; border-radius: 10px; margin-bottom: 20px; border: 1px solid #30363d; }
        .filter-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
        .tab-btn { background: #21262d; border: 1px solid #30363d; color: #8b949e; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-size: 14px; }
        .tab-btn.active { background: #238636; color: #fff; border-color: #238636; }
        .card-row { display: flex; justify-content: space-between; align-items: center; margin-top: 12px; gap: 10px; }
        .card-price { font-size: 18px; font-weight: bold; color: #58a6ff; white-space: nowrap; }
        .btn-buy { background: #238636; color: #fff; padding: 8px 14px; border-radius: 6px; text-decoration: none; font-size: 13px; font-weight: bold; display: inline-block; white-space: nowrap; }
        .card-clickable { cursor: pointer; transition: transform 0.15s ease; }
        .card-clickable:active { transform: scale(0.98); }
    </style>
</head>
<body>
    <nav>
        <a href="index.html">Home</a>
        <a href="sell.html">Sell Account</a>
        <a href="dashboard.html">Dashboard</a>
        <a href="wallet.html">Wallet</a>
        <a href="about.html">About</a>
    </nav>
    <div class="sell-container">
        <h2>Marketplace Listings</h2>
        
        <div class="filter-section">
            <div style="display:flex; gap:10px; margin-bottom:12px;">
                <button id="tabEfootball" class="tab-btn active" onclick="setCategory('eFootball')">🎮 eFootball</button>
                <button id="tabSocial" class="tab-btn" onclick="setCategory('Social Media')">📱 Social Media</button>
            </div>
            <input type="text" id="searchInput" placeholder="Search accounts..." class="search-bar" onkeyup="renderMarketplace()">
            
            <div id="efootballFilters" class="filter-grid">
                <select id="divFilter" class="search-bar" onchange="renderMarketplace()">
                    <option value="">All Divisions</option>
                    <option>Division 1</option>
                    <option>Division 2</option>
                    <option>Division 3</option>
                </select>
                <input type="number" id="ratingFilter" placeholder="Min Rating (e.g. 3000)" class="search-bar" onkeyup="renderMarketplace()">
            </div>
        </div>

        <div id="listingsGrid" class="listings-grid"></div>
    </div>
    <script>
        let currentCat = 'eFootball';

        function setCategory(cat) {
            currentCat = cat;
            document.getElementById('tabEfootball').classList.toggle('active', cat === 'eFootball');
            document.getElementById('tabSocial').classList.toggle('active', cat === 'Social Media');
            document.getElementById('efootballFilters').style.display = cat === 'eFootball' ? 'grid' : 'none';
            renderMarketplace();
        }

        function renderMarketplace() {
            let list = JSON.parse(localStorage.getItem('realonaListings') || '[]');
            let search = document.getElementById('searchInput').value.toLowerCase();
            let div = document.getElementById('divFilter').value;
            let minRating = Number(document.getElementById('ratingFilter').value || 0);

            let filtered = list.filter((item, index) => {
                item.originalIndex = index;
                let matchCat = item.category === currentCat || (!item.category && currentCat === 'eFootball');
                let matchSearch = item.title.toLowerCase().includes(search) || item.details.toLowerCase().includes(search);
                
                if (currentCat === 'eFootball') {
                    let matchDiv = !div || (item.tag && item.tag.includes(div));
                    let ovrMatch = item.details.match(/(\d+)\s*OVR/i);
                    let ovrVal = ovrMatch ? Number(ovrMatch[1]) : 0;
                    let matchRating = !minRating || ovrVal >= minRating;
                    return matchCat && matchSearch && matchDiv && matchRating;
                }
                return matchCat && matchSearch;
            });

            let container = document.getElementById('listingsGrid');
            if (filtered.length === 0) {
                container.innerHTML = `<p style="color:#8b949e; text-align:center; width:100%; grid-column: 1/-1;">No listings available matching filters.</p>`;
                return;
            }

            container.innerHTML = filtered.map(item => `
                <div class="card card-clickable" onclick="window.location.href='listing.html?id=${item.originalIndex}'">
                    ${item.image ? `<img src="${item.image}" style="width:100%; height:160px; object-fit:cover; border-radius:8px; margin-bottom:10px;">` : ''}
                    <h3>${item.title}</h3>
                    <p class="details">${item.details}</p>
                    <div class="card-row">
                        <span class="card-price">${item.price}</span>
                        <a href="buy.html?id=${item.originalIndex}" onclick="event.stopPropagation();" class="btn-buy">Buy via Escrow</a>
                    </div>
                </div>
            `).join('');
        }

        renderMarketplace();
    </script>
</body>
</html>
