<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Listing Details - Realona</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .listing-card { background: #161b22; border: 1px solid #30363d; border-radius: 12px; padding: 20px; margin-top: 15px; }
        .img-container { position: relative; width: 100%; background: #0d1117; border-radius: 8px; border: 1px solid #30363d; margin-bottom: 15px; overflow: hidden; cursor: pointer; text-align: center; }
        .img-preview { width: 100%; max-height: 420px; object-fit: contain; display: block; margin: 0 auto; background: #000; }
        .zoom-badge { position: absolute; bottom: 10px; right: 10px; background: rgba(0,0,0,0.8); color: #fff; font-size: 11px; padding: 4px 8px; border-radius: 4px; pointer-events: none; }
        .btn-buy { display: block; width: 100%; text-align: center; padding: 12px; background: #238636; color: #fff; font-weight: bold; border-radius: 6px; text-decoration: none; margin-top: 15px; border: none; cursor: pointer; box-sizing: border-box; }
        .own-listing-badge { display: block; width: 100%; text-align: center; padding: 12px; background: #21262d; border: 1px solid #30363d; color: #8b949e; font-weight: bold; border-radius: 6px; margin-top: 15px; box-sizing: border-box; }
        .back-link { color: #58a6ff; text-decoration: none; font-size: 13px; display: inline-block; margin-bottom: 10px; }
        .feature-badge { display: inline-block; background: #21262d; border: 1px solid #30363d; color: #c9d1d9; padding: 4px 8px; border-radius: 6px; font-size: 12px; margin-right: 6px; margin-top: 6px; }

        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 999; justify-content: center; align-items: center; }
        .modal-overlay img { max-width: 98%; max-height: 98%; border-radius: 8px; object-fit: contain; }
    </style>
</head>
<body>
    <nav>
        <a href="index.html">Home</a>
        <a href="sell.html">Sell Account</a>
        <a href="dashboard.html">Dashboard</a>
        <a href="wallet.html">Wallet</a>
        <a href="auth.html">Account</a>
    </nav>
    <div class="sell-container">
        <a href="index.html" class="back-link">← Back to Marketplace</a>

        <div class="listing-card">
            <div class="img-container" onclick="openModal()">
                <img id="itemImg" src="https://via.placeholder.com/600x400/161b22/58a6ff?text=No+Screenshot+Provided" class="img-preview" alt="Preview">
                <div class="zoom-badge">🔍 Tap to View Full Screen</div>
            </div>
            
            <h2 id="itemTitle" style="margin: 0 0 8px 0; color:#c9d1d9;">eFootball Pro Account</h2>
            <p id="itemDetails" style="color:#8b949e; font-size:14px; margin: 0 0 10px 0;">3000 OVR • Division 3 • Top Player: Messi</p>
            <div id="sellerTag" style="font-size:12px; color:#58a6ff; margin-bottom:10px;"></div>
            
            <div id="featureBadges" style="margin-bottom: 15px;"></div>

            <div style="font-size: 24px; font-weight: bold; color: #58a6ff; margin-bottom: 15px;" id="itemPrice">₦4,000</div>

            <div style="background:#0d1117; border:1px solid #30363d; padding:12px; border-radius:8px; font-size:13px; color:#8b949e; margin-bottom:15px;">
                🛡️ <strong>Realona Escrow Protection:</strong> Funds are held securely until you verify and log into the account successfully.
            </div>

            <div id="actionArea">
                <a id="buyBtnLink" href="#" class="btn-buy">Buy via Escrow</a>
            </div>
        </div>
    </div>

    <div id="imgModal" class="modal-overlay" onclick="closeModal()">
        <img id="modalImg" src="" alt="Full View">
    </div>
    <script>
        function renderListing() {
            // Guard clause: require user authentication to view listings
            let currentUser = JSON.parse(localStorage.getItem('realonaCurrentUser') || 'null');
            if (!currentUser || !currentUser.email) {
                alert('Please sign in or register to interact with listings.');
                window.location.href = 'auth.html';
                return;
            }

            const urlParams = new URLSearchParams(window.location.search);
            const id = urlParams.get('id') || 0;
            let listings = JSON.parse(localStorage.getItem('realonaListings') || '[]');
            let item = listings[id] || listings[0];

            if (item) {
                document.getElementById('itemTitle').innerText = item.title;
                document.getElementById('itemDetails').innerText = item.details;
                document.getElementById('itemPrice').innerText = item.price;
                
                if (item.sellerName) {
                    document.getElementById('sellerTag').innerText = '👤 Listed by: ' + item.sellerName;
                }

                if (item.image && item.image.trim() !== '') {
                    document.getElementById('itemImg').src = item.image;
                    document.getElementById('modalImg').src = item.image;
                } else {
                    document.getElementById('itemImg').src = 'https://via.placeholder.com/600x400/161b22/58a6ff?text=No+Screenshot+Provided';
                }

                let parts = item.details.split('•');
                let badgesHtml = parts.map(p => `<span class="feature-badge">✓ ${p.trim()}</span>`).join('');
                document.getElementById('featureBadges').innerHTML = badgesHtml;

                // Check if current user is the seller
                if (item.sellerEmail === currentUser.email) {
                    document.getElementById('actionArea').innerHTML = `
                        <div class="own-listing-badge">🔒 This is your own listing</div>
                    `;
                } else {
                    document.getElementById('buyBtnLink').href = 'buy.html?id=' + id;
                }
            }
        }

        function openModal() {
            let imgSrc = document.getElementById('itemImg').src;
            if (imgSrc && !imgSrc.includes('placeholder')) {
                document.getElementById('imgModal').style.display = 'flex';
            }
        }

        function closeModal() {
            document.getElementById('imgModal').style.display = 'none';
        }

        renderListing();
    </script>
</body>
</html>
