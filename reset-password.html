<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Reset Password - Realona</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .auth-card { background: #161b22; border: 1px solid #30363d; border-radius: 12px; padding: 25px; margin-top: 20px; }
        .form-group { margin-bottom: 15px; text-align: left; }
        .form-group label { display: block; font-size: 13px; color: #8b949e; margin-bottom: 5px; }
        .form-group input { width: 100%; padding: 10px; background: #0d1117; border: 1px solid #30363d; color: #c9d1d9; border-radius: 6px; box-sizing: border-box; }
        .btn-submit { width: 100%; padding: 12px; background: #238636; color: #fff; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
        .otp-banner { background: #1f6feb22; border: 1px solid #1f6feb; padding: 12px; border-radius: 8px; color: #58a6ff; font-size: 13px; margin-bottom: 15px; }
    </style>
</head>
<body>
    <nav>
        <a href="index.html">Home</a>
        <a href="auth.html">Login</a>
    </nav>
    <div class="sell-container">
        <div class="auth-card">
            <h2>🔑 Reset Password via OTP</h2>
            <p style="font-size:13px; color:#8b949e; margin-bottom:20px;">Enter your phone number to receive a verification OTP code.</p>

            <!-- Step 1: Request OTP -->
            <div id="stepRequest">
                <div class="form-group">
                    <label>Registered Phone Number</label>
                    <input type="tel" id="resetPhone" placeholder="08123456789">
                </div>
                <button onclick="sendOTP()" class="btn-submit">Send OTP Verification Code</button>
            </div>

            <!-- Step 2: Verify OTP and Reset Password -->
            <div id="stepVerify" style="display:none;">
                <div id="otpDisplayBanner" class="otp-banner"></div>
                
                <div class="form-group">
                    <label>Enter 6-Digit OTP Code</label>
                    <input type="text" id="inputOTP" maxlength="6" placeholder="123456">
                </div>
                <div class="form-group">
                    <label>New Password</label>
                    <input type="password" id="newPassword" placeholder="Enter new password">
                </div>
                <button onclick="verifyAndReset()" class="btn-submit">Update Password</button>
            </div>
        </div>
    </div>
    <script>
        let generatedCode = null;
        let targetPhone = '';

        function sendOTP() {
            targetPhone = document.getElementById('resetPhone').value.trim();
            if (!targetPhone) {
                alert('Please enter your phone number.');
                return;
            }

            // Generate a random 6-digit OTP code
            generatedCode = Math.floor(100000 + Math.random() * 900000).toString();

            document.getElementById('stepRequest').style.display = 'none';
            document.getElementById('stepVerify').style.display = 'block';

            // Simulate SMS notification
            document.getElementById('otpDisplayBanner').innerHTML = `
                📲 <strong>SMS Sent to ${targetPhone}</strong><br>
                Simulated OTP Code: <strong style="font-size:16px; color:#fff;">${generatedCode}</strong>
            `;
        }

        function verifyAndReset() {
            let enteredOTP = document.getElementById('inputOTP').value.trim();
            let newPass = document.getElementById('newPassword').value;

            if (enteredOTP !== generatedCode) {
                alert('Invalid OTP code! Please check and try again.');
                return;
            }

            if (!newPass) {
                alert('Please enter a new password.');
                return;
            }

            // Update user password in localStorage
            let users = JSON.parse(localStorage.getItem('realonaUsers') || '[]');
            let userIndex = users.findIndex(u => u.phone === targetPhone);

            if (userIndex !== -1) {
                users[userIndex].pass = newPass;
                localStorage.setItem('realonaUsers', JSON.stringify(users));
                alert('Password reset successful! You can now log in.');
            } else {
                alert('Password updated for current session.');
            }

            window.location.href = 'auth.html';
        }
    </script>
</body>
</html>
