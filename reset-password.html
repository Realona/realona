<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Reset Password - Realona</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .auth-card { background: #161b22; border: 1px solid #30363d; border-radius: 12px; padding: 25px; margin-top: 20px; }
        .form-group { margin-bottom: 15px; text-align: left; }
        .form-group label { display: block; font-size: 13px; color: #8b949e; margin-bottom: 5px; }
        .form-group input { width: 100%; padding: 10px; background: #0d1117; border: 1px solid #30363d; color: #c9d1d9; border-radius: 6px; box-sizing: border-box; }
        .btn-submit { width: 100%; padding: 12px; background: #238636; color: #fff; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <nav>
        <a href="index.html">Home</a>
        <a href="auth.html">Login</a>
    </nav>
    <div class="sell-container">
        <div class="auth-card">
            <h2>🔑 Reset Password via OTP</h2>
            <p style="font-size:13px; color:#8b949e; margin-bottom:20px;">Enter your email to receive a live 6-digit OTP code.</p>

            <div id="stepRequest">
                <div class="form-group">
                    <label>Account Email Address</label>
                    <input type="email" id="resetEmail" placeholder="your-email@gmail.com">
                </div>
                <button onclick="requestOTP()" class="btn-submit">Send OTP via Email</button>
            </div>

            <div id="stepVerify" style="display:none;">
                <div class="form-group">
                    <label>Enter 6-Digit OTP</label>
                    <input type="text" id="inputOTP" maxlength="6" placeholder="123456">
                </div>
                <div class="form-group">
                    <label>New Password</label>
                    <input type="password" id="newPassword" placeholder="Enter new password">
                </div>
                <button onclick="verifyAndReset()" class="btn-submit">Verify & Reset Password</button>
            </div>
        </div>
    </div>

    <script>
        let userEmail = '';

        async function requestOTP() {
            userEmail = document.getElementById('resetEmail').value.trim();
            if (!userEmail) return alert('Please enter your email address.');

            try {
                let res = await fetch('http://localhost:5000/api/send-otp', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: userEmail })
                });
                let data = await res.json();
                if (data.success) {
                    alert('OTP code sent to ' + userEmail + '! Check your inbox.');
                    document.getElementById('stepRequest').style.display = 'none';
                    document.getElementById('stepVerify').style.display = 'block';
                } else {
                    alert(data.message);
                }
            } catch (err) {
                alert('Backend API server not reachable. Ensure "node server.js" is running!');
            }
        }

        async function verifyAndReset() {
            let otp = document.getElementById('inputOTP').value.trim();
            let newPass = document.getElementById('newPassword').value;

            if (!otp || !newPass) return alert('Please fill in all fields.');

            try {
                let res = await fetch('http://localhost:5000/api/verify-otp', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: userEmail, otp })
                });
                let data = await res.json();
                if (data.success) {
                    alert('Password updated successfully!');
                    window.location.href = 'auth.html';
                } else {
                    alert(data.message);
                }
            } catch (err) {
                alert('Error connecting to backend server.');
            }
        }
    </script>
</body>
</html>
