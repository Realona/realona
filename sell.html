<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sell Item - Realona</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body { background: #0d1117; color: #c9d1d9; font-family: sans-serif; margin:0; padding-bottom:40px; }
        nav { background: #161b22; padding: 12px; display: flex; justify-content: space-around; border-bottom: 1px solid #30363d; }
        nav a { color: #58a6ff; text-decoration: none; font-size: 14px; font-weight: bold; }
        .form-container { max-width: 500px; margin: 20px auto; background: #161b22; border: 1px solid #30363d; padding: 20px; border-radius: 12px; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-size: 13px; font-weight: bold; margin-bottom: 6px; color: #c9d1d9; }
        .form-group input, .form-group textarea { width: 100%; padding: 10px; background: #0d1117; border: 1px solid #30363d; color: #fff; border-radius: 6px; box-sizing: border-box; }
        .btn-submit { background: #238636; color: #fff; border: none; width: 100%; padding: 12px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 14px; }
    </style>
</head>
<body>
    <nav>
        <a href="index.html">Home</a>
        <a href="sell.html" style="color:#58a6ff;">Sell</a>
        <a href="dashboard.html">Dashboard</a>
        <a href="wallet.html">Wallet</a>
        <a href="auth.html">Account</a>
    </nav>

    <div class="form-container">
        <h2 style="margin-top:0; color:#c9d1d9;">📦 List an Item for Sale</h2>
        <form id="sellForm" onsubmit="createListing(event)">
            <div class="form-group">
                <label>Item Title</label>
                <input type="text" id="title" placeholder="e.g. eFootball Pro Account" required>
            </div>
            <div class="form-group">
                <label>Price (e.g. ₦2000)</label>
                <input type="text" id="price" placeholder="₦2000" required>
            </div>
            <div class="form-group">
                <label>Account Credentials / Details</label>
                <textarea id="credentials" rows="3" placeholder="Email, Password, or transfer info for buyer" required></textarea>
            </div>
            <div class="form-group">
                <label>Image URL (or screenshot link)</label>
                <input type="text" id="image" placeholder="https://picsum.photos/400/200">
            </div>
            <button type="submit" class="btn-submit">Publish Listing</button>
        </form>
    </div>

    <script>
        function createListing(e) {
            e.preventDefault();
            let currentUser = JSON.parse(localStorage.getItem('realonaCurrentUser') || 'null');
            if (!currentUser || !currentUser.email) {
                alert('Please sign in first.');
                window.location.href = 'auth.html';
                return;
            }

            let title = document.getElementById('title').value.trim();
            let price = document.getElementById('price').value.trim();
            let credentials = document.getElementById('credentials').value.trim();
            let image = document.getElementById('image').value.trim() || 'https://picsum.photos/400/200';

            let listings = JSON.parse(localStorage.getItem('realonaListings') || '[]');
            
            listings.push({
                title: title,
                price: price,
                credentials: credentials,
                image: image,
                sellerEmail: currentUser.email,
                status: 'Active'
            });

            localStorage.setItem('realonaListings', JSON.stringify(listings));
            alert('✅ Listing published successfully!');
            window.location.href = 'dashboard.html';
        }
    </script>
</body>
</html>
