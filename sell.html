<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sell Account - Realona</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav>
        <a href="index.html">Home</a>
        <a href="sell.html">Sell Account</a>
        <a href="wallet.html">Wallet</a>
        <a href="about.html">About</a>
    </nav>
    <div class="sell-container">
        <div id="step-category" class="sell-step">
            <h2>Sell Your Account</h2>
            <div class="listings-grid">
                <div class="card clickable" onclick="showStep('step-efootball')"><h3>🎮 eFootball</h3><button class="btn-escrow">Select</button></div>
                <div class="card clickable" onclick="showStep('step-social')"><h3>📱 Social Media</h3><button class="btn-escrow">Select</button></div>
            </div>
        </div>
        <div id="step-efootball" class="sell-step" style="display:none;">
            <button onclick="showStep('step-category')" class="btn-back">← Back</button>
            <form onsubmit="handleListingSubmit(event, 'eFootball')" class="form-box">
                <input type="text" id="playerInput" placeholder="Top Player" class="search-bar">
                <button type="button" onclick="addPlayer()" class="btn-add-player">+ Add</button>
                <div id="playersContainer"></div>
                <input type="number" id="squadRating" placeholder="Squad Rating" class="search-bar" required>
                <input type="number" id="price" placeholder="Price (₦)" class="search-bar" required>
                <input type="file" id="screenshotFile" accept="image/*" onchange="handleImg(this)">
                <input type="email" id="konamiId" placeholder="Konami Email" class="search-bar" required>
                <input type="password" id="konamiPass" placeholder="Password" class="search-bar" required>
                <button type="submit" class="btn-escrow">List eFootball</button>
            </form>
        </div>
        <div id="step-social" class="sell-step" style="display:none;">
            <button onclick="showStep('step-category')" class="btn-back">← Back</button>
            <form onsubmit="handleListingSubmit(event, 'Social Media')" class="form-box">
                <input type="text" id="socialPlatform" placeholder="Platform & Handle" class="search-bar" required>
                <input type="text" id="socialStats" placeholder="Followers / Stats" class="search-bar" required>
                <input type="number" id="socialPrice" placeholder="Price (₦)" class="search-bar" required>
                <input type="file" id="screenshotFileSocial" accept="image/*" onchange="handleImg(this)">
                <button type="submit" class="btn-escrow">List Social Media</button>
            </form>
        </div>
    </div>
    <script>
        let players = [], imgStr = '';
        function showStep(id) {
            document.querySelectorAll('.sell-step').forEach(e => e.style.display = 'none');
            document.getElementById(id).style.display = 'block';
        }
        function addPlayer() {
            let i = document.getElementById('playerInput');
            if(i.value.trim() && players.length < 5) { players.push(i.value.trim()); i.value=''; renderP(); }
        }
        function renderP() {
            document.getElementById('playersContainer').innerHTML = players.map(p => `<span class="player-tag">${p}</span>`).join('');
        }
        function handleImg(input) {
            if(input.files && input.files[0]) {
                let r = new FileReader();
                r.onload = e => imgStr = e.target.result;
                r.r.readAsDataURL(input.files[0]);
            }
        }
        function handleListingSubmit(e, cat) {
            e.preventDefault();
            let item = cat === 'eFootball' ? {
                title: 'eFootball Pro Account',
                price: '₦' + Number(document.getElementById('price').value).toLocaleString(),
                details: document.getElementById('squadRating').value + ' OVR • ' + (players[0] || 'Squad'),
                tag: 'Division 2', category: 'eFootball', image: imgStr
            } : {
                title: document.getElementById('socialPlatform').value,
                price: '₦' + Number(document.getElementById('socialPrice').value).toLocaleString(),
                details: document.getElementById('socialStats').value,
                tag: 'Verified', category: 'Social Media', image: imgStr
            };
            let list = JSON.parse(localStorage.getItem('realonaListings') || '[]');
            list.unshift(item);
            localStorage.setItem('realonaListings', JSON.stringify(list));
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
