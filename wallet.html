<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Wallet - Realona</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .wallet-card { background: #161b22; border: 1px solid #30363d; border-radius: 12px; padding: 20px; margin-bottom: 20px; text-align: left; }
        .bal-title { font-size: 28px; font-weight: bold; color: #58a6ff; margin-bottom: 5px; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-size: 13px; color: #8b949e; margin-bottom: 5px; }
        .form-group input { width: 100%; padding: 10px; background: #0d1117; border: 1px solid #30363d; color: #c9d1d9; border-radius: 6px; box-sizing: border-box; }
        .btn-confirm { width: 100%; padding: 12px; background: #1f6feb; color: #fff; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
        .bank-box { background: #0d1117; border: 1px solid #238636; border-radius: 8px; padding: 12px; margin-bottom: 15px; font-size: 13px; color: #c9d1d9; }
        .tx-item { display: flex; justify-content: space-between; align-items: center; background: #0d1117; border: 1px solid #30363d; padding: 10px; border-radius: 6px; margin-bottom: 8px; font-size: 12px; }
    </style>
</head>
<body>
    <nav>
        <a href="index.html">Home</a>
        <a href="sell.html">Sell</a>
        <a href="dashboard.html">Dashboard</a>
        <a href="wallet.html" style="color:#58a6ff;">Wallet</a>
        <a href="auth.html">Account</a>
    </nav>
    <div class="sell-container" style="max-width:500px; margin:20px auto; padding:0 15px;">
        <div class="wallet-card">
            <span style="font-size:12px; color:#8b949e;">Your Active Balance</span>
            <div class="bal-title" id="userWalletBal">₦0</div>
            <p style="color:#8b949e; font-size:11px; margin:0;">Funds are held securely in escrow during active transactions.</p>
        </div>

        <div class="wallet-card">
            <h3 style="margin-top:0; color:#c9d1d9; font-size:16px;">🏦 Manual Moniepoint Deposit</h3>
            <div class="bank-box">
                <div><strong>Bank:</strong> Moniepoint MFB</div>
                <div><strong>Account Number:</strong> 9160385331</div>
                <div><strong>Account Name:</strong> Realona Escrow Services</div>
            </div>

            <form onsubmit="submitDeposit(event)">
                <div class="form-group">
                    <label>Amount Sent (₦)</label>
                    <input type="number" id="depAmount" required placeholder="e.g. 5000">
                </div>
                <div class="form-group">
                    <label>Sender Username / Account Name</label>
                    <input type="text" id="depSender" required placeholder="Name on bank transfer">
                </div>
                <button type="submit" class="btn-confirm">Confirm Deposit</button>
            </form>
        </div>

        <div class="wallet-card">
            <h3 style="margin-top:0; color:#c9d1d9; font-size:15px;">📜 Transaction History</h3>
            <div id="txHistoryContainer"></div>
        </div>
    </div>
    <script>
        let currentUser = JSON.parse(localStorage.getItem('realonaCurrentUser') || 'null');
        if (!currentUser || !currentUser.email) {
            alert('Please sign in to access your wallet.');
            window.location.href = 'auth.html';
        }

        function getSafeBalance(email) {
            let val = localStorage.getItem('realona_wallet_' + email);
            if (!val) return 0;
            let parsed = parseFloat(val.toString().replace(/[^0-9.-]+/g, ''));
            return isNaN(parsed) ? 0 : parsed;
        }

        function loadWallet() {
            let userEmail = currentUser.email.toLowerCase().trim();
            let bal = getSafeBalance(userEmail);
            document.getElementById('userWalletBal').innerText = '₦' + bal.toLocaleString();

            let allDeposits = JSON.parse(localStorage.getItem('realona_pending_deposits') || '[]');
            let userDeposits = allDeposits.filter(d => d.email && d.email.toLowerCase().trim() === userEmail);

            let container = document.getElementById('txHistoryContainer');
            if (userDeposits.length === 0) {
                container.innerHTML = `<p style="color:#8b949e; font-size:12px; text-align:center; margin:0;">No deposit history found.</p>`;
            } else {
                container.innerHTML = userDeposits.map(d => `
                    <div class="tx-item">
                        <div>
                            <strong style="color:#c9d1d9;">Deposit (${d.status})</strong><br>
                            <span style="color:#8b949e;">Sender: ${d.senderName} • ${d.date}</span>
                        </div>
                        <div style="color:${d.status === 'Approved' ? '#3fb950' : '#e3b341'}; font-weight:bold; font-size:14px;">
                            ₦${parseFloat(d.amount).toLocaleString()}
                        </div>
                    </div>
                `).join('');
            }
        }

        function submitDeposit(e) {
            e.preventDefault();
            let amount = parseFloat(document.getElementById('depAmount').value);
            let senderName = document.getElementById('depSender').value.trim();
            let userEmail = currentUser.email.toLowerCase().trim();

            let allDeposits = JSON.parse(localStorage.getItem('realona_pending_deposits') || '[]');
            allDeposits.push({
                id: 'DEP-' + Date.now(),
                email: userEmail,
                username: currentUser.username || 'Trader',
                senderName: senderName,
                amount: amount,
                status: 'Pending',
                date: new Date().toLocaleDateString()
            });

            localStorage.setItem('realona_pending_deposits', JSON.stringify(allDeposits));
            alert('Deposit request submitted! Admin will verify and credit your wallet shortly.');
            document.getElementById('depAmount').value = '';
            document.getElementById('depSender').value = '';
            loadWallet();
        }

        loadWallet();
    </script>
</body>
</html>
